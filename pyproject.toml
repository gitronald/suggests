[project]
name = "suggests"
version = "0.4.3a0"
description = "Algorithm auditing tools for search engine autocomplete"
license = "MIT"
readme = "README.md"
authors = [{ name = "Ronald E. Robertson", email = "rer@acm.org" }]
keywords = ["suggestions", "autocomplete", "google", "bing", "search engine", "search queries"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "polars>=1.0",
    "beautifulsoup4>=4.11",
]

[project.urls]
homepage = "http://github.com/gitronald/suggests"
repository = "https://github.com/gitronald/suggests"

[project.optional-dependencies]
viz = [
    "adjusttext>=1.3.0",
    "igraph>=1.0.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "scipy>=1.11",
]

[project.scripts]
demo = 'suggests.scripts.demo:main'
suggests-plot = 'suggests.scripts.plot:main'

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[dependency-groups]
dev = [
    "adjusttext>=1.3.0",
    "igraph>=1.0.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pre-commit>=4.6.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17,<0.18",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/suggests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE.txt",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

# networkx's stubs misresolve set_node_attributes and _Node generics; relax nets.py only.
[[tool.pyrefly.sub-config]]
matches = "suggests/nets.py"

[tool.pyrefly.sub-config.errors]
no-matching-overload = false
bad-argument-type = false
invalid-argument = false
bad-index = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["suggests"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
