[project]
name = "suggests"
version = "0.4.0"
description = "Algorithm auditing tools for search engine autocomplete"
license = "MIT"
readme = "README.md"
authors = [{ name = "Ronald E. Robertson", email = "rer@acm.org" }]
keywords = ["suggestions", "autocomplete", "google", "bing", "search engine", "search queries"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "polars>=1.0",
    "beautifulsoup4>=4.11",
]

[project.urls]
homepage = "http://github.com/gitronald/suggests"

[project.optional-dependencies]
viz = [
    "adjusttext>=1.3.0",
    "igraph>=1.0.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "scipy>=1.11",
]

[project.scripts]
demo = 'suggests.scripts.demo:main'
suggests-plot = 'suggests.scripts.plot:main'

[dependency-groups]
dev = [
    "adjusttext>=1.3.0",
    "igraph>=1.0.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "pytest>=6.2",
    "pytest-cov>=4.0",
    "ruff>=0.15.4",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), data, images, tests, and tooling out of the published sdist.
only-include = [
    "/suggests",
    "/README.md",
    "/LICENSE.txt",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

# networkx's bundled stubs misresolve the set_node_attributes overloads and
# leave _Node generics unbound, producing false positives on overload and
# argument-type checks; relax those kinds for the network module only.
[[tool.pyrefly.sub-config]]
matches = "suggests/nets.py"

[tool.pyrefly.sub-config.errors]
no-matching-overload = false
bad-argument-type = false
invalid-argument = false
bad-index = false

[tool.pytest.ini_options]
testpaths = ["tests"]
