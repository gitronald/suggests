# Read from the default branch only; dev edits are inert until merged. Setup:
# https://github.com/gitronald/proj-template/blob/main/docs/guides/github-automation.md
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 5
      semver-major-days: 14
